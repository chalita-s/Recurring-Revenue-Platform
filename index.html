<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Orbit Platform — Executive Presentation</title>
  <style>
    :root {
      --navy:#102640;
      --teal:#007d73;
      --teal-dark:#005f59;
      --green:#4b9d3d;
      --gold:#d6a315;
      --paper:#f7f9f8;
      --line:#d8e2df;
      --ink:#102235;
      --muted:#657687;
      --demo-duration:10s;
    }
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9f0ed;font-family:"Segoe UI",Tahoma,sans-serif;color:var(--ink)}
    button{font:inherit}
    .deck{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#edf4f1,#f9fbfa)}
    .track{display:flex;width:200%;height:100%;transform:translateX(0);transition:transform .72s cubic-bezier(.2,.8,.2,1)}
    .deck[data-slide="1"] .track{transform:translateX(-50%)}
    .slide{position:relative;width:50%;height:100%;flex:0 0 50%;display:grid;place-items:center;padding:clamp(12px,2vw,28px);overflow:hidden}
    .slide::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(0,125,115,.08),transparent 42%);pointer-events:none}
    .canvas{position:relative;width:min(100%,calc((100vh - 48px)*1.5323));aspect-ratio:3800/2480;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 22px 58px rgba(16,38,64,.16)}
    .canvas img{width:100%;height:100%;object-fit:contain;display:block}
    .slide-label{position:absolute;bottom:clamp(14px,2vw,28px);left:clamp(16px,2vw,30px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 14px;border:1px solid rgba(0,125,115,.2);border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);box-shadow:0 6px 18px rgba(16,38,64,.08);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal-dark)}
    .slide-label::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(214,163,21,.14)}

    /* Predictive Maintenance animation — restored Version 2 */
    .demo-wrap{position:relative;width:min(100%,calc((100vh - 48px)*1.81034));aspect-ratio:1680/928;border-radius:18px;overflow:hidden;background:#f6f8f6;box-shadow:0 22px 58px rgba(16,38,64,.16)}
    .demo-stage{position:absolute;inset:0;overflow:hidden;background:#f6f8f6;isolation:isolate}
    .demo-stage .scene,.demo-stage .phone,.demo-stage .final-frame,.demo-stage .ambient,.demo-stage .brand-intro,.demo-stage .cursor,.demo-stage .click-ring{position:absolute;inset:0}
    .demo-stage .ambient{z-index:0;opacity:0;background:radial-gradient(circle at 50% 40%,rgba(0,125,115,.13),transparent 34%),linear-gradient(115deg,#f7faf8,#edf4f0 56%,#fafbfa)}
    .demo-stage .brand-intro{z-index:8;display:grid;place-items:center;pointer-events:none}
    .demo-stage .brand-intro::before{content:"";position:absolute;width:24%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(0,125,115,.16),rgba(0,125,115,0) 68%)}
    .demo-stage .brand-intro img{width:15.2%;height:auto;filter:drop-shadow(0 18px 22px rgba(0,78,72,.16))}
    .demo-stage .phone{z-index:3;opacity:0;overflow:hidden;will-change:transform,opacity}
    .demo-stage .phone img,.demo-stage .final-frame img{width:100%;height:100%;object-fit:fill;display:block;user-select:none;pointer-events:none}
    .demo-stage .p1{clip-path:inset(0 74.8% 0 0)}
    .demo-stage .p2{clip-path:inset(0 49.9% 0 25.1%)}
    .demo-stage .p3{clip-path:inset(0 24.9% 0 50%)}
    .demo-stage .p4{clip-path:inset(0 0 0 75%)}
    .demo-stage .cursor{z-index:7;inset:auto;width:1.55%;aspect-ratio:18/28;opacity:0;filter:drop-shadow(0 2px 3px rgba(0,0,0,.42));pointer-events:none}
    .demo-stage .cursor svg{width:100%;height:100%;display:block}
    .demo-stage .click-ring{z-index:6;inset:auto;width:2.7%;aspect-ratio:1;border:clamp(2px,.16vw,3px) solid rgba(0,125,115,.72);border-radius:50%;opacity:0;pointer-events:none}
    .demo-stage .r1{left:17%;top:47%}.demo-stage .r2{left:40%;top:45%}.demo-stage .r3{left:65%;top:51%}.demo-stage .r4{left:89%;top:49%}
    .demo-stage .chart-glow{position:absolute;z-index:5;left:28.7%;top:32.3%;width:17.5%;height:31.4%;border-radius:22px;opacity:0;pointer-events:none}
    .demo-stage .final-frame{z-index:9;opacity:0;pointer-events:none}
    .demo-stage .final-frame::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);transform:translateX(-120%)}

    .demo-stage.run .ambient{animation:ambient-in var(--demo-duration) ease both}
    .demo-stage.run .brand-intro{animation:brand-scene var(--demo-duration) cubic-bezier(.22,.8,.26,1) both}
    .demo-stage.run .brand-intro::before{animation:halo var(--demo-duration) ease-out both}
    .demo-stage.run .brand-intro img{animation:logo-in var(--demo-duration) cubic-bezier(.2,.85,.25,1) both}
    .demo-stage.run .p1{animation:phone-1 var(--demo-duration) cubic-bezier(.18,.86,.28,1) both}
    .demo-stage.run .p2{animation:phone-2 var(--demo-duration) cubic-bezier(.18,.86,.28,1) both}
    .demo-stage.run .p3{animation:phone-3 var(--demo-duration) cubic-bezier(.18,.86,.28,1) both}
    .demo-stage.run .p4{animation:phone-4 var(--demo-duration) cubic-bezier(.18,.86,.28,1) both}
    .demo-stage.run .cursor{animation:cursor-tour var(--demo-duration) cubic-bezier(.45,0,.2,1) both}
    .demo-stage.run .r1{animation:click-1 var(--demo-duration) ease-out both}.demo-stage.run .r2{animation:click-2 var(--demo-duration) ease-out both}.demo-stage.run .r3{animation:click-3 var(--demo-duration) ease-out both}.demo-stage.run .r4{animation:click-4 var(--demo-duration) ease-out both}
    .demo-stage.run .chart-glow{animation:chart-pulse var(--demo-duration) ease-in-out both}
    .demo-stage.run .final-frame{animation:final-hold var(--demo-duration) ease both}
    .demo-stage.run .final-frame::after{animation:sheen var(--demo-duration) ease-in-out both}
    .demo-stage.paused *,.demo-stage.paused *::before,.demo-stage.paused *::after{animation-play-state:paused!important}

    @keyframes ambient-in{0%,7%{opacity:0}12%,82%{opacity:1}88%,100%{opacity:0}}
    @keyframes logo-in{0%{opacity:0;transform:scale(.72) translateY(18%)}5%,12%{opacity:1;transform:scale(1)}18%{opacity:0;transform:scale(.86) translateY(-12%)}100%{opacity:0}}
    @keyframes brand-scene{0%,18%{visibility:visible}18.1%,100%{visibility:hidden}}
    @keyframes halo{0%{opacity:0;transform:scale(.5)}7%{opacity:1;transform:scale(1)}17%,100%{opacity:0;transform:scale(1.35)}}
    @keyframes phone-1{0%,15%{opacity:0;transform:translateX(-18%) translateY(4%) scale(.96)}24%,84%{opacity:1;transform:none}90%,100%{opacity:0;transform:none}}
    @keyframes phone-2{0%,25%{opacity:0;transform:translateY(10%) scale(.96)}34%,84%{opacity:1;transform:none}90%,100%{opacity:0;transform:none}}
    @keyframes phone-3{0%,35%{opacity:0;transform:translateY(10%) scale(.96)}44%,84%{opacity:1;transform:none}90%,100%{opacity:0;transform:none}}
    @keyframes phone-4{0%,45%{opacity:0;transform:translateX(18%) translateY(4%) scale(.96)}54%,84%{opacity:1;transform:none}90%,100%{opacity:0;transform:none}}
    @keyframes cursor-tour{0%,21%{opacity:0;left:13%;top:37%;transform:scale(.8)}24%{opacity:1;left:17.8%;top:46%;transform:scale(1)}27%{left:17.8%;top:46%;transform:scale(.82)}29%{left:17.8%;top:46%;transform:scale(1)}35%{left:40.8%;top:44%;transform:scale(1)}38%{transform:scale(.82)}40%{transform:scale(1)}46%{left:65.8%;top:50%;transform:scale(1)}49%{transform:scale(.82)}51%{transform:scale(1)}57%{left:89.8%;top:48%;transform:scale(1)}60%{transform:scale(.82)}62%{transform:scale(1);opacity:1}67%,100%{opacity:0;left:92%;top:54%}}
    @keyframes click-1{0%,25%{opacity:0;transform:scale(.2)}27%{opacity:1}31%,100%{opacity:0;transform:scale(1.8)}}
    @keyframes click-2{0%,36%{opacity:0;transform:scale(.2)}38%{opacity:1}42%,100%{opacity:0;transform:scale(1.8)}}
    @keyframes click-3{0%,47%{opacity:0;transform:scale(.2)}49%{opacity:1}53%,100%{opacity:0;transform:scale(1.8)}}
    @keyframes click-4{0%,58%{opacity:0;transform:scale(.2)}60%{opacity:1}64%,100%{opacity:0;transform:scale(1.8)}}
    @keyframes chart-pulse{0%,63%{opacity:0;transform:scale(.97)}67%{opacity:1;transform:scale(1);box-shadow:0 0 0 2px rgba(0,125,115,.25),0 0 28px rgba(0,125,115,.22)}71%{opacity:.25;transform:scale(1.015)}75%{opacity:1;transform:scale(1)}80%,100%{opacity:0;transform:scale(1.01)}}
    @keyframes final-hold{0%,82%{opacity:0;transform:scale(1.012)}88%,100%{opacity:1;transform:scale(1)}}
    @keyframes sheen{0%,89%{transform:translateX(-120%);opacity:0}91%{opacity:.55}98%,100%{transform:translateX(120%);opacity:0}}

    .nav{position:fixed;z-index:100;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border:1px solid rgba(255,255,255,.75);border-radius:999px;background:rgba(16,38,64,.84);backdrop-filter:blur(12px);box-shadow:0 8px 26px rgba(16,38,64,.22)}
    .nav button{height:38px;min-width:40px;border:0;border-radius:999px;padding:0 14px;background:transparent;color:#fff;font-weight:700;cursor:pointer}
    .nav button:hover,.nav button:focus-visible{outline:2px solid #fff;background:rgba(255,255,255,.15)}
    .nav button:disabled{opacity:.32;cursor:default;outline:0;background:transparent}
    .counter{min-width:50px;text-align:center;color:#d9e5e2;font:700 12px/1 ui-monospace,Consolas,monospace}
    .progress{position:fixed;z-index:100;left:0;bottom:0;width:100%;height:3px;background:#cddbd7}.progress span{display:block;width:50%;height:100%;background:linear-gradient(90deg,var(--teal),var(--green));transition:width .5s ease}
    .deck[data-slide="1"] .progress span{width:100%}
    .demo-controls{position:absolute;z-index:30;right:14px;bottom:14px;display:flex;gap:6px;padding:6px;border-radius:999px;background:rgba(0,68,63,.78);opacity:.24;transition:opacity .2s}.demo-controls:hover,.demo-controls:focus-within{opacity:1}.demo-controls button{height:34px;border:0;border-radius:999px;background:transparent;color:white;padding:0 11px;font-size:12px;font-weight:700;cursor:pointer}.demo-controls button:hover{background:rgba(255,255,255,.15)}
    @media(max-width:800px){.slide{padding:8px}.slide-label{bottom:8px;left:8px}.nav{bottom:8px}.demo-controls{display:none}}
    @media(prefers-reduced-motion:reduce){.track{transition:none}.demo-stage *,.demo-stage *::before,.demo-stage *::after{animation:none!important}.demo-stage .final-frame{opacity:1}.demo-stage .brand-intro,.demo-stage .phone,.demo-stage .cursor,.demo-stage .click-ring,.demo-stage .chart-glow{display:none}}
  </style>
</head>
<body>
  <main class="deck" id="deck" data-slide="0">
    <div class="track">
      <section class="slide" aria-label="ภาพรวม Orbit Recurring RST Platform">
        <div class="slide-label">01 / Platform Overview</div>
        <figure class="canvas">
          <img src="./exec-summary-recurring-with-orbit-logo-v2.png" alt="ภาพรวม Orbit Recurring RST Platform">
        </figure>
      </section>

      <section class="slide" aria-label="ตัวอย่าง Predictive Maintenance">
        <div class="slide-label">02 / Predictive Maintenance</div>
        <div class="demo-wrap">
          <div class="demo-stage" id="demoStage">
            <div class="ambient"></div>
            <div class="brand-intro" aria-hidden="true"><img src="./orbit-logo.png" alt=""></div>
            <div class="scene" aria-hidden="true">
              <div class="phone p1"><img src="./predictive-maintenance-with-orbit-logo.png" alt=""></div>
              <div class="phone p2"><img src="./predictive-maintenance-with-orbit-logo.png" alt=""></div>
              <div class="phone p3"><img src="./predictive-maintenance-with-orbit-logo.png" alt=""></div>
              <div class="phone p4"><img src="./predictive-maintenance-with-orbit-logo.png" alt=""></div>
              <div class="click-ring r1"></div><div class="click-ring r2"></div><div class="click-ring r3"></div><div class="click-ring r4"></div>
              <div class="chart-glow"></div>
              <div class="cursor"><svg viewBox="0 0 18 28"><path d="M1.2 1.2V22.2L6.15 17.45L10.05 26.4L14.55 24.45L10.55 15.75H17.15Z" fill="#101820" stroke="#fff" stroke-width="1.45" stroke-linejoin="round"/></svg></div>
            </div>
            <div class="final-frame"><img src="./predictive-maintenance-with-orbit-logo.png" alt="ภาพรวมแอป Orbit Predictive Maintenance จำนวนสี่หน้าจอ"></div>
          </div>
          <div class="demo-controls">
            <button type="button" id="replayDemo">↻ Replay</button>
            <button type="button" id="pauseDemo">Ⅱ Pause</button>
          </div>
        </div>
      </section>
    </div>

    <nav class="nav" aria-label="ควบคุมสไลด์">
      <button type="button" id="prev" aria-label="สไลด์ก่อนหน้า">←</button>
      <span class="counter" id="counter">1 / 2</span>
      <button type="button" id="next" aria-label="สไลด์ถัดไป">→</button>
      <button type="button" id="fullscreen" aria-label="เต็มหน้าจอ">⛶</button>
    </nav>
    <div class="progress"><span></span></div>
  </main>

  <script>
    const deck=document.getElementById('deck');
    const demo=document.getElementById('demoStage');
    const prev=document.getElementById('prev');
    const next=document.getElementById('next');
    const counter=document.getElementById('counter');
    const pauseDemo=document.getElementById('pauseDemo');
    let current=0;

    function restartDemo(){demo.classList.remove('paused','run');void demo.offsetWidth;demo.classList.add('run');pauseDemo.textContent='Ⅱ Pause'}
    function show(index){
      current=Math.max(0,Math.min(1,index));
      deck.dataset.slide=String(current);
      counter.textContent=(current+1)+' / 2';
      prev.disabled=current===0;next.disabled=current===1;
      if(current===1) restartDemo(); else demo.classList.remove('run','paused');
      history.replaceState(null,'','#slide-'+(current+1));
    }
    prev.addEventListener('click',()=>show(current-1));
    next.addEventListener('click',()=>show(current+1));
    document.getElementById('replayDemo').addEventListener('click',restartDemo);
    pauseDemo.addEventListener('click',()=>{const paused=demo.classList.toggle('paused');pauseDemo.textContent=paused?'▶ Play':'Ⅱ Pause'});
    document.getElementById('fullscreen').addEventListener('click',async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()});
    document.addEventListener('keydown',e=>{
      if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();show(current+1)}
      if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}
      if(e.key==='Home'){e.preventDefault();show(0)}
      if(e.key==='End'){e.preventDefault();show(1)}
      if(e.key.toLowerCase()==='f')document.getElementById('fullscreen').click();
      if(e.key.toLowerCase()==='r'&&current===1)restartDemo();
      if(e.key===' '&&current===1){e.preventDefault();pauseDemo.click()}
    });
    let touchX=0;deck.addEventListener('touchstart',e=>touchX=e.changedTouches[0].screenX,{passive:true});deck.addEventListener('touchend',e=>{const d=touchX-e.changedTouches[0].screenX;if(Math.abs(d)>50)show(current+(d>0?1:-1))},{passive:true});
    show(location.hash==='#slide-2'?1:0);
  </script>
</body>
</html>
